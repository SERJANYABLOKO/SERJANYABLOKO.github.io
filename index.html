<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Football Boots, Jerseys & Cases</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --bg-main: #0a0c10;
      --bg-card: #121620;
      --accent-green: #00ff66;
      --accent-gold: #ffcc00;
      --text: #ffffff;
      
      /* Цвета редкостей */
      --common: #8a9bb0;
      --rare: #0088ff;
      --epic: #a300ff;
      --legendary: #ffaa00;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px 16px 80px 16px;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(255, 204, 0, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 90%, rgba(0, 255, 102, 0.05) 0%, transparent 60%);
      color: var(--text);
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }

    /* Шапка */
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 900;
      font-size: 18px;
      font-style: italic;
      color: #fff;
      text-transform: uppercase;
    }

    .brand span {
      color: var(--accent-gold);
    }

    .balance-box {
      background: rgba(18, 22, 32, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 15px;
      border: 1px solid rgba(255, 204, 0, 0.3);
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Нижнее меню вкладок */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(18, 22, 32, 0.95);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      max-width: 420px;
      margin: 0 auto;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #6b7280;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      width: 33%;
      padding: 8px 0;
      transition: all 0.2s;
    }

    .nav-tab .tab-icon {
      font-size: 20px;
    }

    .nav-tab.active {
      color: var(--accent-gold);
    }

    /* Контейнеры вкладок */
    .tab-content {
      width: 100%;
      max-width: 420px;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .tab-content.active {
      display: flex;
    }

    /* Селектор кейсов */
    .case-selector {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 12px;
    }

    .case-tab-btn {
      flex: 1;
      padding: 10px;
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #8a9bb0;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .case-tab-btn.active {
      background: rgba(255, 204, 0, 0.1);
      border-color: var(--accent-gold);
      color: #fff;
    }

    /* === ВКЛАДКА 1: КЕЙСЫ === */
    .clicker-section {
      text-align: center;
      margin-bottom: 16px;
    }

    .ball-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d1d5db 60%, #9ca3af 100%);
      border: none;
      font-size: 42px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.2), inset -5px -5px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.05s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      margin: 0 auto;
    }

    .ball-btn:active {
      transform: scale(0.92) rotate(15deg);
    }

    .hint {
      font-size: 11px;
      color: #6b7280;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .case-wrapper {
      width: 100%;
      position: relative;
      background: var(--bg-card);
      border-radius: 16px;
      padding: 14px 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: var(--accent-gold);
      z-index: 10;
      box-shadow: 0 0 12px var(--accent-gold);
    }

    .roulette-viewport {
      overflow: hidden;
      width: 100%;
      height: 110px;
      position: relative;
    }

    .roulette-track {
      display: flex;
      gap: 12px;
      position: absolute;
      left: 0;
      top: 0;
      transition: transform 5s cubic-bezier(0.08, 0.82, 0.17, 0.99);
    }

    .item-card {
      width: 100px;
      height: 105px;
      background: #0d0e15;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 4px solid var(--common);
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      padding: 8px 4px;
      position: relative;
    }

    .item-card.common { border-bottom-color: var(--common); }
    .item-card.rare { border-bottom-color: var(--rare); }
    .item-card.epic { border-bottom-color: var(--epic); }
    .item-card.legendary { 
      border-bottom-color: var(--legendary); 
      box-shadow: inset 0 0 15px rgba(255, 170, 0, 0.15);
    }

    .brand-tag {
      font-size: 9px;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .item-icon {
      font-size: 32px;
      margin: 2px 0;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    .item-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .open-btn {
      margin-top: 16px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
      border: none;
      border-radius: 14px;
      color: #000;
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 204, 0, 0.3);
      transition: all 0.2s;
    }

    .open-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      box-shadow: none;
      background: #2a303c;
      color: #6b7280;
    }

    .result-banner {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 800;
      min-height: 20px;
      text-align: center;
      color: var(--accent-gold);
      text-transform: uppercase;
    }

    /* === ВКЛАДКА 2: ПЕРСОНАЖ И ИМЯ === */
    .character-stage {
      width: 100%;
      background: var(--bg-card);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .player-name-badge {
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .avatar-wrapper {
      position: relative;
      width: 180px;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(255,204,0,0.05) 0%, transparent 70%);
    }

    .player-body {
      font-size: 90px;
      line-height: 1;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
      z-index: 1;
    }

    .equipped-slot {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 2;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .equipped-jersey-slot {
      top: 15px;
    }

    .equipped-boots-slot {
      bottom: 0px;
    }

    .slots-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .equip-slot {
      background: #090a0f;
      border-radius: 12px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      font-size: 10px;
      color: #6b7280;
      font-weight: 700;
      text-transform: uppercase;
    }

    .equip-slot.active-slot {
      border: 1px solid var(--accent-gold);
      background: rgba(255, 204, 0, 0.05);
      color: #fff;
    }

    .equip-slot .slot-title {
      font-size: 9px;
      margin-bottom: 4px;
      opacity: 0.6;
    }

    .locker-inventory {
      width: 100%;
      margin-top: 20px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: #9ca3af;
      letter-spacing: 0.5px;
    }

    .locker-selector-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .locker-item {
      background: #0d0e15;
      border-radius: 12px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .locker-item.equipped {
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 12px rgba(255, 204, 0, 0.3);
      background: rgba(255, 204, 0, 0.05);
    }

    .locker-item .l-icon { font-size: 28px; margin: 4px 0; }
    .locker-item .l-name { font-size: 10px; font-weight: 800; color: #fff; text-align: center; }
    .locker-item .l-sub { font-size: 8px; color: #9ca3af; margin-top: 2px; }

    .equipped-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--accent-gold);
      color: #000;
      font-size: 8px;
      font-weight: 900;
      padding: 2px 4px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* === ВКЛАДКА 3: КОЛЛЕКЦИЯ === */
    .collection-section {
      width: 100%;
      background: var(--bg-card);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .collection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .collection-count {
      color: var(--accent-gold);
      background: rgba(255, 204, 0, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .collection-item {
      background: #090a0f;
      border-radius: 10px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      opacity: 0.35;
      filter: grayscale(100%);
      transition: all 0.3s ease;
    }

    .collection-item.owned {
      opacity: 1;
      filter: grayscale(0%);
      background: #121520;
    }

    .collection-item.owned.common { border: 1px solid var(--common); }
    .collection-item.owned.rare { border: 1px solid var(--rare); box-shadow: 0 0 8px rgba(0,136,255,0.2); }
    .collection-item.owned.epic { border: 1px solid var(--epic); box-shadow: 0 0 8px rgba(163,0,255,0.2); }
    .collection-item.owned.legendary { border: 1px solid var(--legendary); box-shadow: 0 0 10px rgba(255,170,0,0.3); }

    .collection-item .c-icon { font-size: 24px; margin: 4px 0; }
    .collection-item .c-name { font-size: 9px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    .collection-item .c-sub { font-size: 8px; color: #9ca3af; margin-top: 2px; }
    .lock-badge { position: absolute; top: 4px; right: 4px; font-size: 10px; }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div class="header">
    <div class="brand">BOOTS & <span>JERSEYS</span> ⚽</div>
    <div class="balance-box">⭐ <span id="balance">10</span></div>
  </div>

  <!-- ВКЛАДКА 1: КЕЙСЫ -->
  <div class="tab-content active" id="tab-cases">
    <!-- Селектор кейсов -->
    <div class="case-selector">
      <button class="case-tab-btn active" id="btnCaseBoots" onclick="selectCaseType('boots')">👟 Кейс Бутс</button>
      <button class="case-tab-btn" id="btnCaseJerseys" onclick="selectCaseType('jerseys')">👕 Кейс Джерси</button>
    </div>

    <div class="clicker-section">
      <button class="ball-btn" id="clickBtn">⚽</button>
      <div class="hint">Чекань мяч, чтобы фармить Stars</div>
    </div>

    <div class="case-wrapper">
      <div class="pointer"></div>
      <div class="roulette-viewport">
        <div class="roulette-track" id="track"></div>
      </div>
    </div>

    <button class="open-btn" id="openBtn">Открыть кейс (5 ⭐)</button>
    <div class="result-banner" id="resultText"></div>
  </div>

  <!-- ВКЛАДКА 2: ПЕРСОНАЖ / РАЗДЕВАЛКА -->
  <div class="tab-content" id="tab-character">
    <div class="character-stage">
      <!-- Имя игрока -->
      <div class="player-name-badge">
        <span>⚽</span> <span id="playerName">Player</span>
      </div>

      <div class="avatar-wrapper">
        <!-- Надетое Джерси -->
        <div class="equipped-slot equipped-jersey-slot">
          <span id="charJerseyIcon">👕</span>
          <span id="charJerseyName" style="color: #fff;">Без джерси</span>
        </div>

        <div class="player-body">🏃‍♂️</div>

        <!-- Надетые Бутсы -->
        <div class="equipped-slot equipped-boots-slot">
          <span id="charBootIcon">🦶</span>
          <span id="charBootName" style="color: #fff;">Без бутс</span>
        </div>
      </div>

      <div class="slots-grid">
        <div class="equip-slot active-slot">
          <div class="slot-title">Обувь</div>
          <div id="slotBootStatus">Надето</div>
        </div>
        <div class="equip-slot active-slot">
          <div class="slot-title">Джерси</div>
          <div id="slotJerseyStatus">Надето</div>
        </div>
        <div class="equip-slot">
          <div class="slot-title">Аксессуары</div>
          <div>Скоро</div>
        </div>
      </div>
    </div>

    <div class="locker-inventory">
      <div class="section-title">Выбрать бутсы из гардероба</div>
      <div class="locker-selector-grid" id="lockerBootsGrid"></div>

      <div class="section-title" style="margin-top: 16px;">Выбрать джерси из гардероба</div>
      <div class="locker-selector-grid" id="lockerJerseysGrid"></div>
    </div>
  </div>

  <!-- ВКЛАДКА 3: КОЛЛЕКЦИЯ -->
  <div class="tab-content" id="tab-collection">
    <div class="collection-section">
      <div class="collection-header">
        <div>Коллекция Бутс</div>
        <div class="collection-count"><span id="ownedBootsCount">0</span> / 16</div>
      </div>
      <div class="collection-grid" id="collectionBootsGrid"></div>

      <div class="collection-header" style="margin-top: 20px;">
        <div>Коллекция Джерси</div>
        <div class="collection-count"><span id="ownedJerseysCount">0</span> / 12</div>
      </div>
      <div class="collection-grid" id="collectionJerseysGrid"></div>
    </div>
  </div>

  <!-- Навигация -->
  <div class="nav-bar">
    <div class="nav-tab active" onclick="switchTab('cases')">
      <span class="tab-icon">🎰</span>
      <span>Кейсы</span>
    </div>
    <div class="nav-tab" onclick="switchTab('character')">
      <span class="tab-icon">👕</span>
      <span>Игрок</span>
    </div>
    <div class="nav-tab" onclick="switchTab('collection')">
      <span class="tab-icon">🏆</span>
      <span>Коллекция</span>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Загрузка имени из Telegram
    const telegramUser = tg.initDataUnsafe?.user;
    const playerName = telegramUser?.first_name || "Player";
    document.getElementById('playerName').textContent = playerName;

    // База бутс
    const BOOTS = [
      { id: "az_common", type: "boot", brand: "Nike", name: "Air Zoom", subName: "Серый", colorHex: "#718096", rarity: "common", price: 2, icon: "👟" },
      { id: "az_rare", type: "boot", brand: "Nike", name: "Air Zoom", subName: "Синий", colorHex: "#0088ff", rarity: "rare", price: 6, icon: "👟" },
      { id: "az_epic", type: "boot", brand: "Nike", name: "Air Zoom", subName: "Неон", colorHex: "#00ffcc", rarity: "epic", price: 20, icon: "👟" },
      { id: "az_legendary", type: "boot", brand: "Nike", name: "Air Zoom", subName: "Золотой", colorHex: "#ffaa00", rarity: "legendary", price: 75, icon: "👑" },

      { id: "f50_common", type: "boot", brand: "Adidas", name: "F50", subName: "Белый", colorHex: "#e2e8f0", rarity: "common", price: 2, icon: "👟" },
      { id: "f50_rare", type: "boot", brand: "Adidas", name: "F50", subName: "Красный", colorHex: "#e53e3e", rarity: "rare", price: 6, icon: "👟" },
      { id: "f50_epic", type: "boot", brand: "Adidas", name: "F50", subName: "Фиолет", colorHex: "#a300ff", rarity: "epic", price: 25, icon: "👟" },
      { id: "f50_legendary", type: "boot", brand: "Adidas", name: "F50", subName: "Изумруд", colorHex: "#00ff66", rarity: "legendary", price: 100, icon: "👑" },

      { id: "pred_common", type: "boot", brand: "Adidas", name: "Predator", subName: "Черный", colorHex: "#222222", rarity: "common", price: 3, icon: "👟" },
      { id: "pred_rare", type: "boot", brand: "Adidas", name: "Predator", subName: "Желтый", colorHex: "#ffcc00", rarity: "rare", price: 8, icon: "👟" },
      { id: "pred_epic", type: "boot", brand: "Adidas", name: "Predator", subName: "Платина", colorHex: "#cbd5e1", rarity: "epic", price: 30, icon: "👟" },
      { id: "pred_legendary", type: "boot", brand: "Adidas", name: "Predator", subName: "Рубин", colorHex: "#dc2626", rarity: "legendary", price: 120, icon: "👑" },

      { id: "merc_common", type: "boot", brand: "Nike", name: "Mercurial", subName: "Зеленый", colorHex: "#16a34a", rarity: "common", price: 3, icon: "👟" },
      { id: "merc_rare", type: "boot", brand: "Nike", name: "Mercurial", subName: "Оранж", colorHex: "#ea580c", rarity: "rare", price: 9, icon: "👟" },
      { id: "merc_epic", type: "boot", brand: "Nike", name: "Mercurial", colorName: "Розовый", colorHex: "#ec4899", rarity: "epic", price: 40, icon: "👟" },
      { id: "merc_legendary", type: "boot", brand: "Nike", name: "Mercurial", subName: "Алмаз", colorHex: "#00ffff", rarity: "legendary", price: 200, icon: "⚡" }
    ];

    // База Джерси (Реал Мадрид 2017 & Барселона 2025)
    const JERSEYS = [
      // Реал Мадрид 2017
      { id: "rm_casemiro", type: "jersey", brand: "Real Madrid 2017", name: "Casemiro #14", subName: "2017", colorHex: "#ffffff", rarity: "common", price: 3, icon: "👕" },
      { id: "rm_isco", type: "jersey", brand: "Real Madrid 2017", name: "Isco #22", subName: "2017", colorHex: "#00ffff", rarity: "rare", price: 10, icon: "👕" },
      { id: "rm_benzema", type: "jersey", brand: "Real Madrid 2017", name: "Benzema #9", subName: "2017", colorHex: "#ffffff", rarity: "rare", price: 12, icon: "👕" },
      { id: "rm_modric", type: "jersey", brand: "Real Madrid 2017", name: "Modrić #19", subName: "2017", colorHex: "#00ffff", rarity: "epic", price: 35, icon: "👕" },
      { id: "rm_ramos", type: "jersey", brand: "Real Madrid 2017", name: "Ramos #4", subName: "2017", colorHex: "#ffffff", rarity: "epic", price: 40, icon: "👕" },
      { id: "rm_ronaldo", type: "jersey", brand: "Real Madrid 2017", name: "Ronaldo #7", subName: "2017", colorHex: "#ffaa00", rarity: "legendary", price: 250, icon: "👑" },

      // Барселона 2025
      { id: "bar_gavi", type: "jersey", brand: "Barcelona 2025", name: "Gavi #6", subName: "2025", colorHex: "#a50044", rarity: "common", price: 3, icon: "👕" },
      { id: "bar_pedri", type: "jersey", brand: "Barcelona 2025", name: "Pedri #8", subName: "2025", colorHex: "#004d98", rarity: "rare", price: 10, icon: "👕" },
      { id: "bar_cubarsi", type: "jersey", brand: "Barcelona 2025", name: "Cubarsí #2", subName: "2025", colorHex: "#a50044", rarity: "rare", price: 12, icon: "👕" },
      { id: "bar_raphinha", type: "jersey", brand: "Barcelona 2025", name: "Raphinha #11", subName: "2025", colorHex: "#004d98", rarity: "epic", price: 35, icon: "👕" },
      { id: "bar_lewy", type: "jersey", brand: "Barcelona 2025", name: "Lewandowski #9", subName: "2025", colorHex: "#a50044", rarity: "epic", price: 45, icon: "👕" },
      { id: "bar_yamal", type: "jersey", brand: "Barcelona 2025", name: "Lamine Yamal #19", subName: "2025", colorHex: "#00ffff", rarity: "legendary", price: 250, icon: "⚡" }
    ];

    const CASE_COST = 5;
    let activeCaseType = "boots"; // 'boots' или 'jerseys'

    let balance = parseInt(localStorage.getItem('fb_stars_balance')) || 10;
    let collectionBoots = JSON.parse(localStorage.getItem('fb_coll_boots')) || [];
    let collectionJerseys = JSON.parse(localStorage.getItem('fb_coll_jerseys')) || [];
    
    let equippedBootId = localStorage.getItem('fb_equipped_boot') || null;
    let equippedJerseyId = localStorage.getItem('fb_equipped_jersey') || null;
    let isSpinning = false;

    // DOM Элементы
    const balanceEl = document.getElementById('balance');
    const clickBtn = document.getElementById('clickBtn');
    const openBtn = document.getElementById('openBtn');
    const track = document.getElementById('track');
    const resultText = document.getElementById('resultText');

    const lockerBootsGrid = document.getElementById('lockerBootsGrid');
    const lockerJerseysGrid = document.getElementById('lockerJerseysGrid');
    const collectionBootsGrid = document.getElementById('collectionBootsGrid');
    const collectionJerseysGrid = document.getElementById('collectionJerseysGrid');

    const ownedBootsCountEl = document.getElementById('ownedBootsCount');
    const ownedJerseysCountEl = document.getElementById('ownedJerseysCount');

    const charBootIcon = document.getElementById('charBootIcon');
    const charBootName = document.getElementById('charBootName');
    const charJerseyIcon = document.getElementById('charJerseyIcon');
    const charJerseyName = document.getElementById('charJerseyName');

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      
      const tabs = ['cases', 'character', 'collection'];
      const index = tabs.indexOf(tabName);
      document.querySelectorAll('.nav-tab')[index].classList.add('active');
    }

    function selectCaseType(type) {
      if (isSpinning) return;
      activeCaseType = type;
      document.getElementById('btnCaseBoots').classList.toggle('active', type === 'boots');
      document.getElementById('btnCaseJerseys').classList.toggle('active', type === 'jerseys');
      
      currentItems = generateTrack(60);
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';
    }

    function updateUI() {
      balanceEl.textContent = balance;
      openBtn.disabled = isSpinning || balance < CASE_COST;
      
      ownedBootsCountEl.textContent = collectionBoots.length;
      ownedJerseysCountEl.textContent = collectionJerseys.length;
      
      localStorage.setItem('fb_stars_balance', balance);
      localStorage.setItem('fb_coll_boots', JSON.stringify(collectionBoots));
      localStorage.setItem('fb_coll_jerseys', JSON.stringify(collectionJerseys));
      
      if (equippedBootId) localStorage.setItem('fb_equipped_boot', equippedBootId);
      if (equippedJerseyId) localStorage.setItem('fb_equipped_jersey', equippedJerseyId);

      renderCollections();
      renderLockers();
      updateCharacterDisplay();
    }

    // Фарм Stars
    clickBtn.addEventListener('click', () => {
      balance += 1;
      updateUI();
    });

    function updateCharacterDisplay() {
      // Отображение бутс
      if (equippedBootId) {
        const boot = BOOTS.find(b => b.id === equippedBootId);
        if (boot) {
          charBootIcon.textContent = boot.icon;
          charBootName.textContent = boot.name;
          charBootName.style.color = boot.colorHex;
        }
      } else {
        charBootIcon.textContent = "🦶";
        charBootName.textContent = "Без бутс";
        charBootName.style.color = "#fff";
      }

      // Отображение джерси
      if (equippedJerseyId) {
        const jersey = JERSEYS.find(j => j.id === equippedJerseyId);
        if (jersey) {
          charJerseyIcon.textContent = jersey.icon;
          charJerseyName.textContent = jersey.name;
          charJerseyName.style.color = jersey.colorHex;
        }
      } else {
        charJerseyIcon.textContent = "👕";
        charJerseyName.textContent = "Без джерси";
        charJerseyName.style.color = "#fff";
      }
    }

    // Отрисовка раздевалки
    function renderLockers() {
      // Бутсы
      lockerBootsGrid.innerHTML = '';
      if (collectionBoots.length === 0) {
        lockerBootsGrid.innerHTML = `<div style="grid-column: span 3; color: #6b7280; font-size: 11px; text-align: center;">Нет бутс</div>`;
      } else {
        collectionBoots.forEach(id => {
          const item = BOOTS.find(b => b.id === id);
          if (!item) return;
          const isEquipped = equippedBootId === item.id;
          const el = document.createElement('div');
          el.className = `locker-item ${isEquipped ? 'equipped' : ''}`;
          el.onclick = () => { equippedBootId = isEquipped ? null : item.id; updateUI(); };
          el.innerHTML = `
            ${isEquipped ? '<span class="equipped-badge">Надето</span>' : ''}
            <div class="l-icon">${item.icon}</div>
            <div class="l-name">${item.name}</div>
            <div class="l-sub" style="color:${item.colorHex}">${item.subName}</div>
          `;
          lockerBootsGrid.appendChild(el);
        });
      }

      // Джерси
      lockerJerseysGrid.innerHTML = '';
      if (collectionJerseys.length === 0) {
        lockerJerseysGrid.innerHTML = `<div style="grid-column: span 3; color: #6b7280; font-size: 11px; text-align: center;">Нет джерси</div>`;
      } else {
        collectionJerseys.forEach(id => {
          const item = JERSEYS.find(j => j.id === id);
          if (!item) return;
          const isEquipped = equippedJerseyId === item.id;
          const el = document.createElement('div');
          el.className = `locker-item ${isEquipped ? 'equipped' : ''}`;
          el.onclick = () => { equippedJerseyId = isEquipped ? null : item.id; updateUI(); };
          el.innerHTML = `
            ${isEquipped ? '<span class="equipped-badge">Надето</span>' : ''}
            <div class="l-icon">${item.icon}</div>
            <div class="l-name">${item.name}</div>
            <div class="l-sub" style="color:${item.colorHex}">${item.brand}</div>
          `;
          lockerJerseysGrid.appendChild(el);
        });
      }
    }

    // Отрисовка коллекций
    function renderCollections() {
      // Бутсы
      collectionBootsGrid.innerHTML = '';
      BOOTS.forEach(item => {
        const isOwned = collectionBoots.includes(item.id);
        const el = document.createElement('div');
        el.className = `collection-item ${isOwned ? 'owned ' + item.rarity : ''}`;
        el.innerHTML = `
          ${!isOwned ? '<span class="lock-badge">🔒</span>' : ''}
          <div class="c-icon">${item.icon}</div>
          <div class="c-name">${item.name}</div>
          <div class="c-sub" style="${isOwned ? 'color:' + item.colorHex : ''}">${item.subName}</div>
        `;
        collectionBootsGrid.appendChild(el);
      });

      // Джерси
      collectionJerseysGrid.innerHTML = '';
      JERSEYS.forEach(item => {
        const isOwned = collectionJerseys.includes(item.id);
        const el = document.createElement('div');
        el.className = `collection-item ${isOwned ? 'owned ' + item.rarity : ''}`;
        el.innerHTML = `
          ${!isOwned ? '<span class="lock-badge">🔒</span>' : ''}
          <div class="c-icon">${item.icon}</div>
          <div class="c-name">${item.name}</div>
          <div class="c-sub" style="${isOwned ? 'color:' + item.colorHex : ''}">${item.brand}</div>
        `;
        collectionJerseysGrid.appendChild(el);
      });
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.className = `item-card ${item.rarity}`;
      card.innerHTML = `
        <div class="brand-tag">${item.brand}</div>
        <div class="item-icon">${item.icon}</div>
        <div class="item-name">
          <span class="color-dot" style="background:${item.colorHex}"></span>${item.name}
        </div>
      `;
      return card;
    }

    function getRandomItem() {
      const poolList = activeCaseType === 'boots' ? BOOTS : JERSEYS;
      const rand = Math.random() * 100;
      let rarity = "common";
      if (rand < 50) rarity = "common";
      else if (rand < 80) rarity = "rare";
      else if (rand < 95) rarity = "epic";
      else rarity = "legendary";

      const pool = poolList.filter(i => i.rarity === rarity);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function generateTrack(count = 60) {
      track.innerHTML = '';
      const items = [];
      for (let i = 0; i < count; i++) {
        const item = getRandomItem();
        items.push(item);
        track.appendChild(createCard(item));
      }
      return items;
    }

    let currentItems = generateTrack();
    updateUI();

    // Открытие кейса
    openBtn.addEventListener('click', () => {
      if (balance < CASE_COST || isSpinning) return;

      balance -= CASE_COST;
      isSpinning = true;
      resultText.textContent = '';
      updateUI();

      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      currentItems = generateTrack(60);

      const targetIndex = 45;
      const winningItem = currentItems[targetIndex];
      const cardWidth = 112;
      const viewportWidth = track.parentElement.clientWidth;
      
      const randomOffset = Math.floor(Math.random() * 60) - 30;
      const targetPos = (targetIndex * cardWidth) - (viewportWidth / 2) + (cardWidth / 2) + randomOffset;

      setTimeout(() => {
        track.style.transition = 'transform 5s cubic-bezier(0.08, 0.82, 0.17, 0.99)';
        track.style.transform = `translateX(-${targetPos}px)`;
      }, 50);

      setTimeout(() => {
        isSpinning = false;
        
        const targetCollection = winningItem.type === 'boot' ? collectionBoots : collectionJerseys;
        
        if (targetCollection.includes(winningItem.id)) {
          // Повторка
          balance += winningItem.price;
          resultText.style.color = '#ffcc00';
          resultText.textContent = `Повторка ${winningItem.name}! +${winningItem.price} ⭐`;
        } else {
          // Новая вещь
          targetCollection.push(winningItem.id);
          
          if (winningItem.type === 'boot' && !equippedBootId) equippedBootId = winningItem.id;
          if (winningItem.type === 'jersey' && !equippedJerseyId) equippedJerseyId = winningItem.id;
          
          resultText.style.color = '#00ff66';
          resultText.textContent = `ВЫПАЛО: ${winningItem.brand} ${winningItem.name}!`;
        }
        
        updateUI();
      }, 5100);
    });
  </script>
</body>
