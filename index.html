<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мониторинг IT Заказов</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f1f5f9; padding: 24px 16px; margin: 0; }
    .container { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    
    .card { background: #161f30; border: 1px solid #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
    .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .card h3 { margin: 0; font-size: 17px; line-height: 1.4; }
    
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
    .badge-tg { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-web { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
    
    .price { font-weight: 600; color: #f59e0b; font-size: 15px; }
    .card a { align-self: flex-start; background: #2563eb; color: #ffffff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; }
    .card a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Лента заказов</h1>
    <div class="subtitle">Только Telegram боты, Mini Apps и веб-сайты</div>
    
    <div id="orders">Загрузка актуальных заказов...</div>
  </div>

  <script>
    async function loadOrders() {
      try {
        const res = await fetch(`orders.json?t=${Date.now()}`);
        const orders = await res.json();
        const container = document.getElementById('orders');
        
        if (!orders.length) {
          container.innerHTML = '<p style="color: #64748b;">Новых заказов по этим темам пока нет. Проверь чуть позже!</p>';
          return;
        }

        container.innerHTML = orders.map(o => `
          <div class="card">
            <div class="header-row">
              <h3>${o.title}</h3>
              <span class="badge ${o.category === 'Telegram' ? 'badge-tg' : 'badge-web'}">${o.category}</span>
            </div>
            <div class="price">${o.price}</div>
            <a href="${o.url}" target="_blank" rel="noopener">Открыть задачу</a>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('orders').innerHTML = '<p style="color: #ef4444;">Не удалось загрузить данные.</p>';
      }
    }
    loadOrders();
  </script>
</body>
</html>
