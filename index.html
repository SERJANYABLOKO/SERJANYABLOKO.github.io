<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Football Boots Case & Collection</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --bg-main: #0a0c10;
      --bg-card: #121620;
      --accent-green: #00ff66;
      --accent-gold: #ffcc00;
      --text: #ffffff;
      
      /* Цвета редкостей */
      --common: #8a9bb0;
      --rare: #0088ff;
      --epic: #a300ff;
      --legendary: #ffaa00;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(0, 255, 102, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 90%, rgba(0, 136, 255, 0.05) 0%, transparent 60%);
      color: var(--text);
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }

    /* Шапка */
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 900;
      font-size: 18px;
      font-style: italic;
      color: #fff;
      text-transform: uppercase;
    }

    .brand span {
      color: var(--accent-green);
    }

    .balance-box {
      background: rgba(18, 22, 32, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 15px;
      border: 1px solid rgba(0, 255, 102, 0.2);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Кликер */
    .clicker-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .ball-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d1d5db 60%, #9ca3af 100%);
      border: none;
      font-size: 48px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.2), inset -5px -5px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.05s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      margin: 0 auto;
    }

    .ball-btn:active {
      transform: scale(0.92) rotate(15deg);
    }

    .hint {
      font-size: 11px;
      color: #6b7280;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Кейс и рулетка */
    .case-wrapper {
      width: 100%;
      max-width: 420px;
      position: relative;
      background: var(--bg-card);
      border-radius: 16px;
      padding: 14px 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: var(--accent-green);
      z-index: 10;
      box-shadow: 0 0 12px var(--accent-green);
    }

    .roulette-viewport {
      overflow: hidden;
      width: 100%;
      height: 110px;
      position: relative;
    }

    .roulette-track {
      display: flex;
      gap: 12px;
      position: absolute;
      left: 0;
      top: 0;
      transition: transform 5s cubic-bezier(0.08, 0.82, 0.17, 0.99);
    }

    /* Карточка бутс */
    .boot-card {
      width: 100px;
      height: 105px;
      background: #0d0e15;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 4px solid var(--common);
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      padding: 8px 4px;
      position: relative;
    }

    .boot-card.common { border-bottom-color: var(--common); }
    .boot-card.rare { border-bottom-color: var(--rare); }
    .boot-card.epic { border-bottom-color: var(--epic); }
    .boot-card.legendary { 
      border-bottom-color: var(--legendary); 
      box-shadow: inset 0 0 15px rgba(255, 170, 0, 0.15);
    }

    .brand-tag {
      font-size: 9px;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .boot-icon {
      font-size: 32px;
      margin: 2px 0;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    .boot-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .boot-color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Кнопка открытия */
    .open-btn {
      margin-top: 16px;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      background: linear-gradient(135deg, #00ff66 0%, #009933 100%);
      border: none;
      border-radius: 14px;
      color: #000;
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
      transition: all 0.2s;
    }

    .open-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      box-shadow: none;
      background: #2a303c;
      color: #6b7280;
    }

    /* Результат */
    .result-banner {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 800;
      min-height: 20px;
      text-align: center;
      color: var(--accent-green);
      text-transform: uppercase;
    }

    /* Секция Коллекции */
    .collection-section {
      width: 100%;
      max-width: 420px;
      margin-top: 24px;
      background: var(--bg-card);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .collection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .collection-count {
      color: var(--accent-green);
      background: rgba(0, 255, 102, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .collection-item {
      background: #090a0f;
      border-radius: 10px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      opacity: 0.35;
      filter: grayscale(100%);
      transition: all 0.3s ease;
    }

    .collection-item.owned {
      opacity: 1;
      filter: grayscale(0%);
      background: #121520;
    }

    .collection-item.owned.common { border: 1px solid var(--common); }
    .collection-item.owned.rare { border: 1px solid var(--rare); box-shadow: 0 0 8px rgba(0,136,255,0.2); }
    .collection-item.owned.epic { border: 1px solid var(--epic); box-shadow: 0 0 8px rgba(163,0,255,0.2); }
    .collection-item.owned.legendary { border: 1px solid var(--legendary); box-shadow: 0 0 10px rgba(255,170,0,0.3); }

    .collection-item .c-icon {
      font-size: 24px;
      margin: 4px 0;
    }

    .collection-item .c-name {
      font-size: 9px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .collection-item .c-color {
      font-size: 8px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .lock-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 10px;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div class="header">
    <div class="brand">BOOTS <span>CASE</span> ⚽</div>
    <div class="balance-box">🪙 <span id="balance">100</span></div>
  </div>

  <!-- Набивание мяча -->
  <div class="clicker-section">
    <button class="ball-btn" id="clickBtn">⚽</button>
    <div class="hint">Чекань мяч, чтобы зарабатывать монеты</div>
  </div>

  <!-- Рулетка бутс -->
  <div class="case-wrapper">
    <div class="pointer"></div>
    <div class="roulette-viewport">
      <div class="roulette-track" id="track"></div>
    </div>
  </div>

  <!-- Кнопка -->
  <button class="open-btn" id="openBtn">Открыть кейс (50 🪙)</button>
  <div class="result-banner" id="resultText"></div>

  <!-- Коллекция -->
  <div class="collection-section">
    <div class="collection-header">
      <div>Коллекция</div>
      <div class="collection-count"><span id="ownedCount">0</span> / 16</div>
    </div>
    <div class="collection-grid" id="collectionGrid"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Полный список бутс (только Air Zoom, F50, Predator, Mercurial)
    const BOOTS = [
      // Nike Air Zoom
      { id: "az_common", brand: "Nike", name: "Air Zoom", colorName: "Серый", colorHex: "#718096", rarity: "common", price: 20, icon: "👟" },
      { id: "az_rare", brand: "Nike", name: "Air Zoom", colorName: "Синий", colorHex: "#0088ff", rarity: "rare", price: 60, icon: "👟" },
      { id: "az_epic", brand: "Nike", name: "Air Zoom", colorName: "Неон", colorHex: "#00ffcc", rarity: "epic", price: 200, icon: "👟" },
      { id: "az_legendary", brand: "Nike", name: "Air Zoom", colorName: "Золотой", colorHex: "#ffaa00", rarity: "legendary", price: 750, icon: "👑" },

      // Adidas F50
      { id: "f50_common", brand: "Adidas", name: "F50", colorName: "Белый", colorHex: "#e2e8f0", rarity: "common", price: 20, icon: "👟" },
      { id: "f50_rare", brand: "Adidas", name: "F50", colorName: "Красный", colorHex: "#e53e3e", rarity: "rare", price: 60, icon: "👟" },
      { id: "f50_epic", brand: "Adidas", name: "F50", colorName: "Фиолет", colorHex: "#a300ff", rarity: "epic", price: 250, icon: "👟" },
      { id: "f50_legendary", brand: "Adidas", name: "F50", colorName: "Изумруд", colorHex: "#00ff66", rarity: "legendary", price: 1000, icon: "👑" },

      // Adidas Predator
      { id: "pred_common", brand: "Adidas", name: "Predator", colorName: "Черный", colorHex: "#222222", rarity: "common", price: 25, icon: "👟" },
      { id: "pred_rare", brand: "Adidas", name: "Predator", colorName: "Желтый", colorHex: "#ffcc00", rarity: "rare", price: 75, icon: "👟" },
      { id: "pred_epic", brand: "Adidas", name: "Predator", colorName: "Платина", colorHex: "#cbd5e1", rarity: "epic", price: 300, icon: "👟" },
      { id: "pred_legendary", brand: "Adidas", name: "Predator", colorName: "Рубин", colorHex: "#dc2626", rarity: "legendary", price: 1200, icon: "👑" },

      // Nike Mercurial
      { id: "merc_common", brand: "Nike", name: "Mercurial", colorName: "Зеленый", colorHex: "#16a34a", rarity: "common", price: 30, icon: "👟" },
      { id: "merc_rare", brand: "Nike", name: "Mercurial", colorName: "Оранж", colorHex: "#ea580c", rarity: "rare", price: 90, icon: "👟" },
      { id: "merc_epic", brand: "Nike", name: "Mercurial", colorName: "Розовый", colorHex: "#ec4899", rarity: "epic", price: 400, icon: "👟" },
      { id: "merc_legendary", brand: "Nike", name: "Mercurial", colorName: "Алмаз", colorHex: "#00ffff", rarity: "legendary", price: 2000, icon: "⚡" }
    ];

    const CASE_COST = 50;
    let balance = parseInt(localStorage.getItem('fb_balance')) || 100;
    let collection = JSON.parse(localStorage.getItem('fb_collection')) || [];
    let isSpinning = false;

    const balanceEl = document.getElementById('balance');
    const clickBtn = document.getElementById('clickBtn');
    const openBtn = document.getElementById('openBtn');
    const track = document.getElementById('track');
    const resultText = document.getElementById('resultText');
    const collectionGrid = document.getElementById('collectionGrid');
    const ownedCountEl = document.getElementById('ownedCount');

    function updateUI() {
      balanceEl.textContent = balance;
      openBtn.disabled = isSpinning || balance < CASE_COST;
      ownedCountEl.textContent = collection.length;
      localStorage.setItem('fb_balance', balance);
      localStorage.setItem('fb_collection', JSON.stringify(collection));
      renderCollection();
    }

    // Чеканка мяча
    clickBtn.addEventListener('click', () => {
      balance += 1;
      updateUI();
    });

    // Отрисовка сетки коллекции
    function renderCollection() {
      collectionGrid.innerHTML = '';
      BOOTS.forEach(boot => {
        const isOwned = collection.includes(boot.id);
        const itemEl = document.createElement('div');
        itemEl.className = `collection-item ${isOwned ? 'owned ' + boot.rarity : ''}`;
        
        itemEl.innerHTML = `
          ${!isOwned ? '<span class="lock-badge">🔒</span>' : ''}
          <div class="c-icon">${boot.icon}</div>
          <div class="c-name">${boot.name}</div>
          <div class="c-color" style="${isOwned ? 'color:' + boot.colorHex : ''}">${boot.colorName}</div>
        `;
        collectionGrid.appendChild(itemEl);
      });
    }

    // Создание карточки для ленты
    function createBootCard(boot) {
      const card = document.createElement('div');
      card.className = `boot-card ${boot.rarity}`;
      card.innerHTML = `
        <div class="brand-tag">${boot.brand}</div>
        <div class="boot-icon">${boot.icon}</div>
        <div class="boot-name">
          <span class="boot-color-dot" style="background:${boot.colorHex}"></span>${boot.name}
        </div>
      `;
      return card;
    }

    // Случайный выбор с учетом шансов выпадания
    function getRandomBoot() {
      const rand = Math.random() * 100;
      let rarity = "common";
      if (rand < 50) rarity = "common";       // 50%
      else if (rand < 80) rarity = "rare";    // 30%
      else if (rand < 95) rarity = "epic";    // 15%
      else rarity = "legendary";              // 5%

      const pool = BOOTS.filter(b => b.rarity === rarity);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    // Генерация рулетки
    function generateTrack(count = 60) {
      track.innerHTML = '';
      const items = [];
      for (let i = 0; i < count; i++) {
        const boot = getRandomBoot();
        items.push(boot);
        track.appendChild(createBootCard(boot));
      }
      return items;
    }

    let currentItems = generateTrack();
    updateUI();

    // Вращение рулетки
    openBtn.addEventListener('click', () => {
      if (balance < CASE_COST || isSpinning) return;

      balance -= CASE_COST;
      isSpinning = true;
      resultText.textContent = '';
      updateUI();

      // Мгновенный сброс
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      currentItems = generateTrack(60);

      const targetIndex = 45;
      const winningBoot = currentItems[targetIndex];
      const cardWidth = 112; // 100px + 12px gap
      const viewportWidth = track.parentElement.clientWidth;
      
      const randomOffset = Math.floor(Math.random() * 60) - 30;
      const targetPos = (targetIndex * cardWidth) - (viewportWidth / 2) + (cardWidth / 2) + randomOffset;

      setTimeout(() => {
        track.style.transition = 'transform 5s cubic-bezier(0.08, 0.82, 0.17, 0.99)';
        track.style.transform = `translateX(-${targetPos}px)`;
      }, 50);

      // Завершение анимации и обработка повторок
      setTimeout(() => {
        isSpinning = false;
        
        if (collection.includes(winningBoot.id)) {
          // Повторка — начисляем деньги
          balance += winningBoot.price;
          resultText.style.color = '#ffcc00';
          resultText.textContent = `Повторка ${winningBoot.name} (${winningBoot.colorName})! +${winningBoot.price} 🪙`;
        } else {
          // Новая бутса — добавляем в коллекцию
          collection.push(winningBoot.id);
          resultText.style.color = '#00ff66';
          resultText.textContent = `НОВАЯ БУТСА: ${winningBoot.brand} ${winningBoot.name} (${winningBoot.colorName})!`;
        }
        
        updateUI();
      }, 5100);
    });
  </script>
</body>
</html>
