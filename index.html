<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEO · GOURMET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0a0c;
      font-family: 'Inter', sans-serif;
      color: #e6e0d8;
      padding: 2rem 1.5rem;
      line-height: 1.5;
      min-height: 100vh;
      background-image: radial-gradient(circle at 20% 30%, #1f1822 0%, #0b0a0c 80%);
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
    }

    /* премиум неон заголовок */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(180, 139, 107, 0.25);
      box-shadow: 0 8px 20px -8px rgba(180, 139, 107, 0.08);
    }

    .logo h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 2.5rem;
      letter-spacing: -0.02em;
      color: #f0eae4;
      text-shadow: 0 0 8px #b48b6b55, 0 0 20px #b48b6b22;
    }
    .logo span {
      color: #d9b89b;
      font-weight: 400;
      font-style: italic;
      text-shadow: 0 0 12px #d9b89b66;
    }
    .logo .sub {
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 4px;
      color: #b8a392;
      text-shadow: 0 0 6px #b48b6b33;
      margin-top: 0.2rem;
    }

    .admin-toggle {
      background: rgba(20, 18, 22, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid #b48b6b66;
      padding: 0.7rem 2rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.95rem;
      color: #f0eae4;
      box-shadow: 0 0 16px #b48b6b22, inset 0 0 16px #b48b6b11;
      transition: all 0.3s;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .admin-toggle i {
      color: #d9b89b;
      font-size: 1.1rem;
      filter: drop-shadow(0 0 6px #d9b89b88);
    }
    .admin-toggle:hover {
      background: #1f1822;
      border-color: #d9b89b;
      box-shadow: 0 0 28px #b48b6b44, inset 0 0 20px #b48b6b22;
      transform: scale(1.02);
    }

    /* админ-панель — тёмная неон */
    .admin-panel {
      background: rgba(14, 12, 16, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 36px;
      padding: 2rem 2rem 1.8rem;
      margin-bottom: 3.5rem;
      border: 1px solid #b48b6b55;
      box-shadow: 0 20px 40px -12px #000000aa, 0 0 30px #b48b6b11, inset 0 0 30px #b48b6b08;
      transition: all 0.3s;
      display: none;
    }
    .admin-panel.open {
      display: block;
      animation: neonFade 0.35s ease;
    }
    @keyframes neonFade {
      0% { opacity: 0; transform: translateY(-10px) scale(0.98); filter: blur(2px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    .admin-panel h3 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 1.8rem;
      margin-bottom: 1.2rem;
      color: #f0eae4;
      letter-spacing: -0.01em;
      text-shadow: 0 0 18px #d9b89b55;
    }
    .admin-panel h3 i {
      color: #d9b89b;
      margin-right: 12px;
      filter: drop-shadow(0 0 8px #d9b89b77);
    }
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem 1.8rem;
    }
    .admin-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(0,0,0,0.2);
      padding: 1rem 1rem 1.2rem;
      border-radius: 24px;
      border: 1px solid #b48b6b22;
    }
    .admin-item label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      color: #b8a392;
      text-shadow: 0 0 6px #b48b6b22;
      margin-top: 4px;
    }
    .admin-item input, .admin-item textarea {
      padding: 0.7rem 1.2rem;
      border: 1px solid #b48b6b44;
      border-radius: 30px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      background: rgba(10, 8, 12, 0.7);
      color: #f0eae4;
      transition: 0.25s;
      width: 100%;
      box-shadow: inset 0 0 20px #00000055, 0 0 8px #b48b6b08;
    }
    .admin-item input:focus, .admin-item textarea:focus {
      outline: none;
      border-color: #d9b89b;
      background: rgba(20, 16, 22, 0.8);
      box-shadow: 0 0 20px #b48b6b44, inset 0 0 20px #b48b6b08;
    }
    .admin-item textarea {
      min-height: 60px;
      resize: vertical;
    }
    .admin-item .image-upload-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .admin-item .image-upload-wrapper input[type="file"] {
      flex: 1;
      min-width: 140px;
      padding: 0.5rem 0.8rem;
      border: 1px dashed #b48b6b66;
      border-radius: 30px;
      background: rgba(0,0,0,0.3);
      color: #b8a392;
      font-size: 0.85rem;
    }
    .admin-item .image-upload-wrapper input[type="file"]::-webkit-file-upload-button {
      background: #b48b6b44;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      color: #f0eae4;
      cursor: pointer;
      transition: 0.2s;
    }
    .admin-item .image-upload-wrapper input[type="file"]::-webkit-file-upload-button:hover {
      background: #d9b89b66;
    }
    .admin-item .image-preview {
      max-width: 80px;
      max-height: 80px;
      border-radius: 16px;
      object-fit: cover;
      border: 1px solid #b48b6b44;
      box-shadow: 0 0 16px #b48b6b22;
      background: #1a161c;
    }
    .admin-item .image-url-input {
      margin-top: 4px;
      font-size: 0.75rem;
      color: #7a6a5c;
    }
    .admin-item .image-url-input input {
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid #b48b6b33;
      color: #d6cdc4;
      width: 100%;
    }

    .admin-actions {
      display: flex;
      justify-content: flex-end;
      gap: 18px;
      margin-top: 2rem;
      border-top: 1px solid #b48b6b33;
      padding-top: 1.8rem;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      background: transparent;
      padding: 0.7rem 2.2rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.95rem;
      transition: 0.3s;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .btn-primary {
      background: #d9b89b;
      color: #0b0a0c;
      font-weight: 600;
      box-shadow: 0 0 24px #d9b89b44, 0 4px 12px #00000066;
    }
    .btn-primary:hover {
      background: #f0d6c0;
      box-shadow: 0 0 40px #d9b89b88, 0 8px 20px #00000088;
      transform: scale(1.02);
    }
    .btn-outline {
      border: 1px solid #b48b6b66;
      color: #d6cdc4;
      background: rgba(0,0,0,0.2);
    }
    .btn-outline:hover {
      background: #b48b6b22;
      border-color: #d9b89b;
      box-shadow: 0 0 20px #b48b6b33;
    }
    .btn-add {
      background: #2a2228;
      color: #f0eae4;
      border: 1px solid #b48b6b66;
      box-shadow: 0 0 12px #b48b6b11;
    }
    .btn-add:hover {
      background: #3d313a;
      border-color: #d9b89b;
      box-shadow: 0 0 28px #b48b6b44;
    }

    /* сетка рецептов — тёмная неон */
    .recipes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .recipe-card {
      background: rgba(16, 14, 18, 0.75);
      backdrop-filter: blur(6px);
      border-radius: 36px;
      padding: 1.8rem 1.8rem 2rem;
      border: 1px solid #b48b6b44;
      box-shadow: 0 8px 30px #00000066, 0 0 20px #b48b6b08;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .recipe-card:hover {
      transform: translateY(-8px);
      border-color: #d9b89b88;
      box-shadow: 0 20px 40px #000000aa, 0 0 40px #b48b6b22;
    }
    .recipe-card .recipe-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 24px;
      margin-bottom: 1rem;
      border: 1px solid #b48b6b44;
      box-shadow: 0 0 20px #b48b6b11;
      background: #1a161c;
    }
    .recipe-card .emoji-badge {
      font-size: 2.5rem;
      line-height: 1;
      margin-bottom: 0.3rem;
      filter: drop-shadow(0 0 12px #d9b89b66);
    }
    .recipe-card h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      color: #f0eae4;
      margin: 0.3rem 0 0.2rem;
      text-shadow: 0 0 12px #d9b89b33;
    }
    .recipe-card .meta {
      display: flex;
      gap: 1.2rem;
      font-size: 0.8rem;
      color: #b8a392;
      border-bottom: 1px dashed #b48b6b44;
      padding-bottom: 0.8rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .recipe-card .meta i {
      margin-right: 6px;
      color: #d9b89b;
      filter: drop-shadow(0 0 6px #d9b89b55);
    }
    .recipe-card .description {
      font-weight: 400;
      color: #d6cdc4;
      font-size: 0.95rem;
      line-height: 1.6;
      flex: 1;
    }
    .recipe-card .ingredients {
      background: rgba(0,0,0,0.35);
      padding: 0.7rem 1.2rem;
      border-radius: 40px;
      margin: 1.2rem 0 0.2rem;
      font-size: 0.85rem;
      color: #d6cdc4;
      border-left: 4px solid #d9b89b;
      box-shadow: inset 0 0 20px #00000044;
    }
    .recipe-card .ingredients i {
      color: #d9b89b;
      margin-right: 8px;
      filter: drop-shadow(0 0 6px #d9b89b66);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      background: rgba(16, 14, 18, 0.5);
      border-radius: 60px;
      border: 1px dashed #b48b6b55;
      backdrop-filter: blur(6px);
    }
    .empty-state i {
      font-size: 3.5rem;
      color: #b48b6b;
      filter: drop-shadow(0 0 24px #d9b89b55);
      margin-bottom: 1rem;
    }
    .empty-state h3 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #f0eae4;
      text-shadow: 0 0 18px #d9b89b33;
    }
    .empty-state p {
      color: #b8a392;
      max-width: 400px;
      margin: 0.5rem auto 0;
    }

    .footer-note {
      margin-top: 4rem;
      text-align: center;
      font-size: 0.8rem;
      color: #7a6a5c;
      border-top: 1px solid #b48b6b33;
      padding-top: 2rem;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px #b48b6b11;
    }

    @media (max-width: 700px) {
      .admin-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; gap: 1.2rem; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- ШАПКА НЕОН -->
  <header class="header">
    <div class="logo">
      <h1>neo<span>·</span>gourmet</h1>
      <div class="sub"><i class="fas fa-bolt" style="margin-right: 6px;"></i> премиум · тёмная кухня</div>
    </div>
    <button class="admin-toggle" id="adminToggleBtn">
      <i class="fas fa-pen-fancy"></i> Админ-панель
    </button>
  </header>

  <!-- АДМИН-ПАНЕЛЬ (редактирование / добавление) -->
  <div class="admin-panel" id="adminPanel">
    <h3><i class="fas fa-sliders-h"></i> Редактор рецептов</h3>
    <div class="admin-grid" id="adminFormContainer">
      <!-- динамически заполняется из JS -->
    </div>
    <div style="display: flex; justify-content: flex-start; margin: 1rem 0 0.5rem;">
      <button class="btn btn-add" id="addRecipeBtn"><i class="fas fa-plus-circle"></i> Добавить рецепт</button>
    </div>
    <div class="admin-actions">
      <button class="btn btn-outline" id="resetDefaultsBtn"><i class="fas fa-undo-alt"></i> Сбросить</button>
      <button class="btn btn-primary" id="saveChangesBtn"><i class="fas fa-check"></i> Сохранить</button>
    </div>
    <p style="font-size:0.75rem; color:#7a6a5c; margin-top: 1rem; opacity:0.7; letter-spacing: 0.5px;">
      <i class="fas fa-image"></i> загрузите изображение или введите URL · изменения в памяти
    </p>
  </div>

  <!-- СЕТКА РЕЦЕПТОВ -->
  <div class="recipes-grid" id="recipesGrid"></div>

  <div class="footer-note">
    <i class="fas fa-moon"></i>  неоновая кулинария · добавляй свои шедевры
  </div>
</div>

<script>
  (function() {
    // ---- ПУСТОЙ МАССИВ (все рецепты удалены) ----
    let recipes = [];

    // DOM элементы
    const grid = document.getElementById('recipesGrid');
    const adminPanel = document.getElementById('adminPanel');
    const adminToggleBtn = document.getElementById('adminToggleBtn');
    const adminFormContainer = document.getElementById('adminFormContainer');
    const saveBtn = document.getElementById('saveChangesBtn');
    const resetBtn = document.getElementById('resetDefaultsBtn');
    const addBtn = document.getElementById('addRecipeBtn');

    // ------ РЕНДЕР РЕЦЕПТОВ (с картинками) ------
    function renderRecipes() {
      if (!grid) return;
      if (recipes.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-utensils"></i>
            <h3>Нет рецептов</h3>
            <p>Откройте админ-панель и добавьте свои кулинарные шедевры.</p>
          </div>
        `;
        return;
      }
      grid.innerHTML = recipes.map((r, index) => {
        const imageHtml = r.image && r.image.trim() !== '' 
          ? `<img src="${r.image}" alt="${r.title || 'блюдо'}" class="recipe-image" onerror="this.style.display='none'" />` 
          : '';
        return `
        <div class="recipe-card" data-id="${r.id || index}">
          ${imageHtml}
          <div class="emoji-badge">${r.emoji || '🍽️'}</div>
          <h2>${r.title || 'Блюдо'}</h2>
          <div class="meta">
            <span><i class="far fa-clock"></i> ${r.time || '30 мин'}</span>
            <span><i class="fas fa-signal"></i> ${r.difficulty || 'средний'}</span>
          </div>
          <div class="description">${r.description || 'Описание отсутствует'}</div>
          <div class="ingredients"><i class="fas fa-leaf"></i> ${r.ingredients || 'Ингредиенты не указаны'}</div>
        </div>
      `}).join('');
    }

    // ------ ЗАПОЛНИТЬ АДМИН-ФОРМУ (с полем для картинки) ------
    function renderAdminForm() {
      if (!adminFormContainer) return;
      if (recipes.length === 0) {
        adminFormContainer.innerHTML = `
          <div class="admin-item" style="grid-column: 1 / -1; text-align: center; padding: 1.5rem 0; opacity:0.7;">
            <i class="fas fa-plus-circle" style="font-size: 2rem; color: #b48b6b; margin-bottom: 0.5rem;"></i>
            <p style="color: #b8a392;">Нет рецептов. Нажмите «Добавить рецепт».</p>
          </div>
        `;
        return;
      }
      adminFormContainer.innerHTML = recipes.map((r, index) => `
        <div class="admin-item" style="grid-column: ${index % 2 === 0 ? '1' : '2'};">
          <label><i class="fas fa-utensil-spoon"></i> Рецепт #${index + 1}</label>
          <input type="text" class="admin-title" value="${r.title || ''}" placeholder="Название" data-index="${index}" />
          <input type="text" class="admin-emoji" value="${r.emoji || '🍽️'}" placeholder="Эмодзи" data-index="${index}" style="max-width:80px;" />
          <input type="text" class="admin-time" value="${r.time || ''}" placeholder="Время" data-index="${index}" />
          <input type="text" class="admin-difficulty" value="${r.difficulty || ''}" placeholder="Сложность" data-index="${index}" />
          <textarea class="admin-desc" placeholder="Описание" data-index="${index}">${r.description || ''}</textarea>
          <textarea class="admin-ingredients" placeholder="Ингредиенты" data-index="${index}">${r.ingredients || ''}</textarea>
          
          <label><i class="fas fa-image"></i> Изображение</label>
          <div class="image-upload-wrapper">
            <input type="file" class="admin-image-file" accept="image/*" data-index="${index}" />
            <input type="text" class="admin-image-url" value="${r.image || ''}" placeholder="или URL картинки" data-index="${index}" />
          </div>
          ${r.image && r.image.trim() !== '' ? `<img src="${r.image}" class="image-preview" alt="превью" onerror="this.style.display='none'" />` : ''}
          <div class="image-url-input">
            <input type="text" class="admin-image-final" value="${r.image || ''}" placeholder="финальный URL (можно скопировать)" data-index="${index}" readonly style="background:rgba(0,0,0,0.4); color:#7a6a5c; font-size:0.7rem;" />
          </div>
        </div>
      `).join('');

      // Обработчики для загрузки файлов и преобразования в base64
      document.querySelectorAll('.admin-image-file').forEach((fileInput) => {
        fileInput.addEventListener('change', function(e) {
          const index = parseInt(this.dataset.index, 10);
          const file = this.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function(ev) {
            const base64 = ev.target.result;
            // обновляем поле URL и финальное поле
            const urlInput = document.querySelector(`.admin-image-url[data-index="${index}"]`);
            const finalInput = document.querySelector(`.admin-image-final[data-index="${index}"]`);
            if (urlInput) urlInput.value = base64;
            if (finalInput) finalInput.value = base64;
            // обновляем превью
            const preview = document.querySelector(`.admin-item .image-preview`);
            if (preview) {
              preview.src = base64;
              preview.style.display = 'block';
            } else {
              // если превью нет — создадим
              const wrapper = fileInput.closest('.admin-item');
              const existingPreview = wrapper.querySelector('.image-preview');
              if (!existingPreview) {
                const img = document.createElement('img');
                img.className = 'image-preview';
                img.src = base64;
                img.alt = 'превью';
                wrapper.appendChild(img);
              } else {
                existingPreview.src = base64;
                existingPreview.style.display = 'block';
              }
            }
          };
          reader.readAsDataURL(file);
        });
      });

      // При ручном вводе URL — обновляем финальное поле и превью
      document.querySelectorAll('.admin-image-url').forEach((urlInput) => {
        urlInput.addEventListener('input', function() {
          const index = parseInt(this.dataset.index, 10);
          const finalInput = document.querySelector(`.admin-image-final[data-index="${index}"]`);
          if (finalInput) finalInput.value = this.value;
          // обновляем превью
          const item = this.closest('.admin-item');
          const preview = item.querySelector('.image-preview');
          if (preview) {
            preview.src = this.value;
            preview.style.display = this.value.trim() !== '' ? 'block' : 'none';
          }
        });
      });
    }

    // ------ СОХРАНИТЬ ИЗ ФОРМЫ (с картинками) ------
    function saveFromAdminForm() {
      const titleInputs = document.querySelectorAll('.admin-title');
      const emojiInputs = document.querySelectorAll('.admin-emoji');
      const timeInputs = document.querySelectorAll('.admin-time');
      const diffInputs = document.querySelectorAll('.admin-difficulty');
      const descInputs = document.querySelectorAll('.admin-desc');
      const ingrInputs = document.querySelectorAll('.admin-ingredients');
      const imageInputs = document.querySelectorAll('.admin-image-url'); // берем из URL поля (оно обновляется и из файла)

      const updated = [];
      titleInputs.forEach((input, idx) => {
        const index = parseInt(input.dataset.index, 10);
        const image = imageInputs[idx] ? imageInputs[idx].value.trim() : '';
        updated.push({
          id: index + 1,
          title: input.value.trim() || 'Блюдо',
          emoji: emojiInputs[idx] ? emojiInputs[idx].value.trim() : '🍽️',
          time: timeInputs[idx] ? timeInputs[idx].value.trim() : '30 мин',
          difficulty: diffInputs[idx] ? diffInputs[idx].value.trim() : 'средний',
          description: descInputs[idx] ? descInputs[idx].value.trim() : 'Описание отсутствует',
          ingredients: ingrInputs[idx] ? ingrInputs[idx].value.trim() : 'Ингредиенты не указаны',
          image: image
        });
      });

      recipes = updated;
      renderRecipes();
      renderAdminForm();
    }

    // ------ ДОБАВИТЬ ПУСТОЙ РЕЦЕПТ ------
    function addEmptyRecipe() {
      recipes.push({
        id: Date.now(),
        title: 'Новый рецепт',
        emoji: '🍽️',
        time: '30 мин',
        difficulty: 'средний',
        description: 'Введите описание',
        ingredients: 'ингредиенты...',
        image: ''
      });
      renderRecipes();
      renderAdminForm();
      if (!adminPanel.classList.contains('open')) {
        adminPanel.classList.add('open');
      }
    }

    // ------ СБРОС К ПУСТОМУ СОСТОЯНИЮ ------
    function resetToEmpty() {
      if (recipes.length > 0 && !confirm('Удалить все рецепты?')) return;
      recipes = [];
      renderRecipes();
      renderAdminForm();
    }

    // ------ ОТКРЫТЬ/ЗАКРЫТЬ АДМИНКУ ------
    function toggleAdminPanel() {
      const isOpen = adminPanel.classList.toggle('open');
      if (isOpen) {
        renderAdminForm();
      }
    }

    // ------ ИНИЦИАЛИЗАЦИЯ ------
    function init() {
      renderRecipes();

      adminToggleBtn.addEventListener('click', toggleAdminPanel);

      saveBtn.addEventListener('click', function(e) {
        e.preventDefault();
        saveFromAdminForm();
        const originalText = saveBtn.innerHTML;
        saveBtn.innerHTML = '<i class="fas fa-check-circle"></i> Готово!';
        setTimeout(() => { saveBtn.innerHTML = originalText; }, 1200);
      });

      resetBtn.addEventListener('click', function(e) {
        e.preventDefault();
        resetToEmpty();
        if (adminPanel.classList.contains('open')) {
          renderAdminForm();
        }
      });

      addBtn.addEventListener('click', function(e) {
        e.preventDefault();
        addEmptyRecipe();
      });

      console.log('🌙 neo·gourmet — тёмная неоновая кулинария с картинками');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
</script>
</body>
</html>
