<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Заказы</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 800px; margin: auto; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .card h3 { margin: 0 0 8px 0; font-size: 18px; }
    .card p { margin: 0 0 12px 0; color: #94a3b8; font-size: 14px; }
    .card a { display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Свежие заказы в IT</h1>
  <div id="orders">Загрузка заказов...</div>

  <script>
    async function loadOrders() {
      try {
        // Добавляем timestamp, чтобы браузер не кэшировал старый JSON
        const res = await fetch(`orders.json?t=${Date.now()}`);
        const orders = await res.json();
        
        const container = document.getElementById('orders');
        if (!orders.length) {
          container.innerHTML = '<p>Подходящих заказов пока нет.</p>';
          return;
        }

        container.innerHTML = orders.map(o => `
          <div class="card">
            <h3>${o.title}</h3>
            <p>Бюджет: ${o.price || 'Договорной'}</p>
            <a href="${o.url}" target="_blank">Перейти к заказу</a>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('orders').innerHTML = '<p>Ошибка загрузки данных.</p>';
      }
    }
    loadOrders();
  </script>
</body>
</html>
