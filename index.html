<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Football Boots Case & Stars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --bg-main: #0a0c10;
      --bg-card: #121620;
      --accent-green: #00ff66;
      --accent-gold: #ffcc00;
      --text: #ffffff;
      
      /* Цвета редкостей */
      --common: #8a9bb0;
      --rare: #0088ff;
      --epic: #a300ff;
      --legendary: #ffaa00;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px 16px 80px 16px;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(255, 204, 0, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 90%, rgba(0, 255, 102, 0.05) 0%, transparent 60%);
      color: var(--text);
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }

    /* Шапка */
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 900;
      font-size: 18px;
      font-style: italic;
      color: #fff;
      text-transform: uppercase;
    }

    .brand span {
      color: var(--accent-gold);
    }

    .balance-box {
      background: rgba(18, 22, 32, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 15px;
      border: 1px solid rgba(255, 204, 0, 0.3);
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Нижнее меню вкладок */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(18, 22, 32, 0.95);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      max-width: 420px;
      margin: 0 auto;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #6b7280;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      width: 33%;
      padding: 8px 0;
      transition: all 0.2s;
    }

    .nav-tab .tab-icon {
      font-size: 20px;
    }

    .nav-tab.active {
      color: var(--accent-gold);
    }

    /* Контейнеры вкладок */
    .tab-content {
      width: 100%;
      max-width: 420px;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .tab-content.active {
      display: flex;
    }

    /* === ВКЛАДКА 1: КЕЙСЫ === */
    .clicker-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .ball-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d1d5db 60%, #9ca3af 100%);
      border: none;
      font-size: 48px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.2), inset -5px -5px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.05s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      margin: 0 auto;
    }

    .ball-btn:active {
      transform: scale(0.92) rotate(15deg);
    }

    .hint {
      font-size: 11px;
      color: #6b7280;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .case-wrapper {
      width: 100%;
      position: relative;
      background: var(--bg-card);
      border-radius: 16px;
      padding: 14px 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: var(--accent-gold);
      z-index: 10;
      box-shadow: 0 0 12px var(--accent-gold);
    }

    .roulette-viewport {
      overflow: hidden;
      width: 100%;
      height: 110px;
      position: relative;
    }

    .roulette-track {
      display: flex;
      gap: 12px;
      position: absolute;
      left: 0;
      top: 0;
      transition: transform 5s cubic-bezier(0.08, 0.82, 0.17, 0.99);
    }

    .boot-card {
      width: 100px;
      height: 105px;
      background: #0d0e15;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 4px solid var(--common);
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      padding: 8px 4px;
      position: relative;
    }

    .boot-card.common { border-bottom-color: var(--common); }
    .boot-card.rare { border-bottom-color: var(--rare); }
    .boot-card.epic { border-bottom-color: var(--epic); }
    .boot-card.legendary { 
      border-bottom-color: var(--legendary); 
      box-shadow: inset 0 0 15px rgba(255, 170, 0, 0.15);
    }

    .brand-tag {
      font-size: 9px;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .boot-icon {
      font-size: 32px;
      margin: 2px 0;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    .boot-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .boot-color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .open-btn {
      margin-top: 16px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
      border: none;
      border-radius: 14px;
      color: #000;
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 204, 0, 0.3);
      transition: all 0.2s;
    }

    .open-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      box-shadow: none;
      background: #2a303c;
      color: #6b7280;
    }

    .result-banner {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 800;
      min-height: 20px;
      text-align: center;
      color: var(--accent-gold);
      text-transform: uppercase;
    }

    /* === ВКЛАДКА 2: ПЕРСОНАЖ И ИМЯ === */
    .character-stage {
      width: 100%;
      background: var(--bg-card);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    /* Имя игрока */
    .player-name-badge {
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .avatar-wrapper {
      position: relative;
      width: 180px;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(255,204,0,0.05) 0%, transparent 70%);
    }

    .player-body {
      font-size: 90px;
      line-height: 1;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
      z-index: 1;
    }

    .equipped-boots-slot {
      position: absolute;
      bottom: 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 2;
    }

    .equipped-boots-icon {
      font-size: 20px;
    }

    .equipped-boots-info {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .slots-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .equip-slot {
      background: #090a0f;
      border-radius: 12px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      font-size: 10px;
      color: #6b7280;
      font-weight: 700;
      text-transform: uppercase;
    }

    .equip-slot.active-slot {
      border: 1px solid var(--accent-gold);
      background: rgba(255, 204, 0, 0.05);
      color: #fff;
    }

    .equip-slot .slot-title {
      font-size: 9px;
      margin-bottom: 4px;
      opacity: 0.6;
    }

    .locker-inventory {
      width: 100%;
      margin-top: 20px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: #9ca3af;
      letter-spacing: 0.5px;
    }

    .boots-selector-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .locker-item {
      background: #0d0e15;
      border-radius: 12px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .locker-item.equipped {
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 12px rgba(255, 204, 0, 0.3);
      background: rgba(255, 204, 0, 0.05);
    }

    .locker-item .l-icon { font-size: 28px; margin: 4px 0; }
    .locker-item .l-name { font-size: 10px; font-weight: 800; color: #fff; text-align: center; }
    .locker-item .l-color { font-size: 8px; color: #9ca3af; margin-top: 2px; }

    .equipped-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--accent-gold);
      color: #000;
      font-size: 8px;
      font-weight: 900;
      padding: 2px 4px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* === ВКЛАДКА 3: КОЛЛЕКЦИЯ === */
    .collection-section {
      width: 100%;
      background: var(--bg-card);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .collection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .collection-count {
      color: var(--accent-gold);
      background: rgba(255, 204, 0, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .collection-item {
      background: #090a0f;
      border-radius: 10px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      opacity: 0.35;
      filter: grayscale(100%);
      transition: all 0.3s ease;
    }

    .collection-item.owned {
      opacity: 1;
      filter: grayscale(0%);
      background: #121520;
    }

    .collection-item.owned.common { border: 1px solid var(--common); }
    .collection-item.owned.rare { border: 1px solid var(--rare); box-shadow: 0 0 8px rgba(0,136,255,0.2); }
    .collection-item.owned.epic { border: 1px solid var(--epic); box-shadow: 0 0 8px rgba(163,0,255,0.2); }
    .collection-item.owned.legendary { border: 1px solid var(--legendary); box-shadow: 0 0 10px rgba(255,170,0,0.3); }

    .collection-item .c-icon { font-size: 24px; margin: 4px 0; }
    .collection-item .c-name { font-size: 9px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    .collection-item .c-color { font-size: 8px; color: #9ca3af; margin-top: 2px; }
    .lock-badge { position: absolute; top: 4px; right: 4px; font-size: 10px; }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div class="header">
    <div class="brand">BOOTS <span>CASE</span> ⚽</div>
    <div class="balance-box">⭐ <span id="balance">10</span></div>
  </div>

  <!-- ВКЛАДКА 1: КЕЙСЫ -->
  <div class="tab-content active" id="tab-cases">
    <div class="clicker-section">
      <button class="ball-btn" id="clickBtn">⚽</button>
      <div class="hint">Чекань мяч, чтобы фармить Stars</div>
    </div>

    <div class="case-wrapper">
      <div class="pointer"></div>
      <div class="roulette-viewport">
        <div class="roulette-track" id="track"></div>
      </div>
    </div>

    <button class="open-btn" id="openBtn">Открыть кейс (5 ⭐)</button>
    <div class="result-banner" id="resultText"></div>
  </div>

  <!-- ВКЛАДКА 2: ПЕРСОНАЖ / РАЗДЕВАЛКА -->
  <div class="tab-content" id="tab-character">
    <div class="character-stage">
      <!-- Имя игрока -->
      <div class="player-name-badge">
        <span>⚽</span> <span id="playerName">Player</span>
      </div>

      <div class="avatar-wrapper">
        <div class="player-body">🏃‍♂️</div>
        <div class="equipped-boots-slot">
          <span class="equipped-boots-icon" id="charBootIcon">🦶</span>
          <span class="equipped-boots-info" id="charBootName">Без бутс</span>
        </div>
      </div>

      <div class="slots-grid">
        <div class="equip-slot active-slot">
          <div class="slot-title">Обувь</div>
          <div id="slotBootStatus">Надето</div>
        </div>
        <div class="equip-slot">
          <div class="slot-title">Джерси</div>
          <div>Скоро</div>
        </div>
        <div class="equip-slot">
          <div class="slot-title">Аксессуары</div>
          <div>Скоро</div>
        </div>
      </div>
    </div>

    <div class="locker-inventory">
      <div class="section-title">Выбрать бутсы из гардероба</div>
      <div class="boots-selector-grid" id="lockerGrid"></div>
    </div>
  </div>

  <!-- ВКЛАДКА 3: КОЛЛЕКЦИЯ -->
  <div class="tab-content" id="tab-collection">
    <div class="collection-section">
      <div class="collection-header">
        <div>Коллекция Бутс</div>
        <div class="collection-count"><span id="ownedCount">0</span> / 16</div>
      </div>
      <div class="collection-grid" id="collectionGrid"></div>
    </div>
  </div>

  <!-- Навигация -->
  <div class="nav-bar">
    <div class="nav-tab active" onclick="switchTab('cases')">
      <span class="tab-icon">🎰</span>
      <span>Кейсы</span>
    </div>
    <div class="nav-tab" onclick="switchTab('character')">
      <span class="tab-icon">👕</span>
      <span>Игрок</span>
    </div>
    <div class="nav-tab" onclick="switchTab('collection')">
      <span class="tab-icon">🏆</span>
      <span>Коллекция</span>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Загрузка имени из Telegram
    const telegramUser = tg.initDataUnsafe?.user;
    const playerName = telegramUser?.first_name || "Player";
    document.getElementById('playerName').textContent = playerName;

    // База бутс
    const BOOTS = [
      { id: "az_common", brand: "Nike", name: "Air Zoom", colorName: "Серый", colorHex: "#718096", rarity: "common", price: 2, icon: "👟" },
      { id: "az_rare", brand: "Nike", name: "Air Zoom", colorName: "Синий", colorHex: "#0088ff", rarity: "rare", price: 6, icon: "👟" },
      { id: "az_epic", brand: "Nike", name: "Air Zoom", colorName: "Неон", colorHex: "#00ffcc", rarity: "epic", price: 20, icon: "👟" },
      { id: "az_legendary", brand: "Nike", name: "Air Zoom", colorName: "Золотой", colorHex: "#ffaa00", rarity: "legendary", price: 75, icon: "👑" },

      { id: "f50_common", brand: "Adidas", name: "F50", colorName: "Белый", colorHex: "#e2e8f0", rarity: "common", price: 2, icon: "👟" },
      { id: "f50_rare", brand: "Adidas", name: "F50", colorName: "Красный", colorHex: "#e53e3e", rarity: "rare", price: 6, icon: "👟" },
      { id: "f50_epic", brand: "Adidas", name: "F50", colorName: "Фиолет", colorHex: "#a300ff", rarity: "epic", price: 25, icon: "👟" },
      { id: "f50_legendary", brand: "Adidas", name: "F50", colorName: "Изумруд", colorHex: "#00ff66", rarity: "legendary", price: 100, icon: "👑" },

      { id: "pred_common", brand: "Adidas", name: "Predator", colorName: "Черный", colorHex: "#222222", rarity: "common", price: 3, icon: "👟" },
      { id: "pred_rare", brand: "Adidas", name: "Predator", colorName: "Желтый", colorHex: "#ffcc00", rarity: "rare", price: 8, icon: "👟" },
      { id: "pred_epic", brand: "Adidas", name: "Predator", colorName: "Платина", colorHex: "#cbd5e1", rarity: "epic", price: 30, icon: "👟" },
      { id: "pred_legendary", brand: "Adidas", name: "Predator", colorName: "Рубин", colorHex: "#dc2626", rarity: "legendary", price: 120, icon: "👑" },

      { id: "merc_common", brand: "Nike", name: "Mercurial", colorName: "Зеленый", colorHex: "#16a34a", rarity: "common", price: 3, icon: "👟" },
      { id: "merc_rare", brand: "Nike", name: "Mercurial", colorName: "Оранж", colorHex: "#ea580c", rarity: "rare", price: 9, icon: "👟" },
      { id: "merc_epic", brand: "Nike", name: "Mercurial", colorName: "Розовый", colorHex: "#ec4899", rarity: "epic", price: 40, icon: "👟" },
      { id: "merc_legendary", brand: "Nike", name: "Mercurial", colorName: "Алмаз", colorHex: "#00ffff", rarity: "legendary", price: 200, icon: "⚡" }
    ];

    const CASE_COST = 5; // Цена кейса = 5 Stars
    let balance = parseInt(localStorage.getItem('fb_stars_balance')) || 10;
    let collection = JSON.parse(localStorage.getItem('fb_collection')) || [];
    let equippedBootId = localStorage.getItem('fb_equipped') || null;
    let isSpinning = false;

    // DOM Элементы
    const balanceEl = document.getElementById('balance');
    const clickBtn = document.getElementById('clickBtn');
    const openBtn = document.getElementById('openBtn');
    const track = document.getElementById('track');
    const resultText = document.getElementById('resultText');
    const collectionGrid = document.getElementById('collectionGrid');
    const lockerGrid = document.getElementById('lockerGrid');
    const ownedCountEl = document.getElementById('ownedCount');

    const charBootIcon = document.getElementById('charBootIcon');
    const charBootName = document.getElementById('charBootName');

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      
      const tabs = ['cases', 'character', 'collection'];
      const index = tabs.indexOf(tabName);
      document.querySelectorAll('.nav-tab')[index].classList.add('active');
    }

    function updateUI() {
      balanceEl.textContent = balance;
      openBtn.disabled = isSpinning || balance < CASE_COST;
      ownedCountEl.textContent = collection.length;
      
      localStorage.setItem('fb_stars_balance', balance);
      localStorage.setItem('fb_collection', JSON.stringify(collection));
      if (equippedBootId) localStorage.setItem('fb_equipped', equippedBootId);

      renderCollection();
      renderLocker();
      updateCharacterDisplay();
    }

    // Фарм Stars
    clickBtn.addEventListener('click', () => {
      balance += 1;
      updateUI();
    });

    function updateCharacterDisplay() {
      if (equippedBootId) {
        const boot = BOOTS.find(b => b.id === equippedBootId);
        if (boot) {
          charBootIcon.textContent = boot.icon;
          charBootName.textContent = `${boot.name} (${boot.colorName})`;
          charBootName.style.color = boot.colorHex;
          return;
        }
      }
      charBootIcon.textContent = "🦶";
      charBootName.textContent = "Без бутс";
      charBootName.style.color = "#fff";
    }

    function renderLocker() {
      lockerGrid.innerHTML = '';
      if (collection.length === 0) {
        lockerGrid.innerHTML = `<div style="grid-column: span 3; color: #6b7280; font-size: 12px; text-align: center; padding: 20px;">Гардероб пуст. Открывайте кейсы!</div>`;
        return;
      }

      collection.forEach(id => {
        const boot = BOOTS.find(b => b.id === id);
        if (!boot) return;

        const isEquipped = equippedBootId === boot.id;
        const itemEl = document.createElement('div');
        itemEl.className = `locker-item ${isEquipped ? 'equipped' : ''}`;
        itemEl.onclick = () => equipBoot(boot.id);

        itemEl.innerHTML = `
          ${isEquipped ? '<span class="equipped-badge">Надето</span>' : ''}
          <div class="l-icon">${boot.icon}</div>
          <div class="l-name">${boot.name}</div>
          <div class="l-color" style="color:${boot.colorHex}">${boot.colorName}</div>
        `;
        lockerGrid.appendChild(itemEl);
      });
    }

    function equipBoot(id) {
      if (equippedBootId === id) {
        equippedBootId = null;
      } else {
        equippedBootId = id;
      }
      updateUI();
    }

    function renderCollection() {
      collectionGrid.innerHTML = '';
      BOOTS.forEach(boot => {
        const isOwned = collection.includes(boot.id);
        const itemEl = document.createElement('div');
        itemEl.className = `collection-item ${isOwned ? 'owned ' + boot.rarity : ''}`;
        
        itemEl.innerHTML = `
          ${!isOwned ? '<span class="lock-badge">🔒</span>' : ''}
          <div class="c-icon">${boot.icon}</div>
          <div class="c-name">${boot.name}</div>
          <div class="c-color" style="${isOwned ? 'color:' + boot.colorHex : ''}">${boot.colorName}</div>
        `;
        collectionGrid.appendChild(itemEl);
      });
    }

    function createBootCard(boot) {
      const card = document.createElement('div');
      card.className = `boot-card ${boot.rarity}`;
      card.innerHTML = `
        <div class="brand-tag">${boot.brand}</div>
        <div class="boot-icon">${boot.icon}</div>
        <div class="boot-name">
          <span class="boot-color-dot" style="background:${boot.colorHex}"></span>${boot.name}
        </div>
      `;
      return card;
    }

    function getRandomBoot() {
      const rand = Math.random() * 100;
      let rarity = "common";
      if (rand < 50) rarity = "common";
      else if (rand < 80) rarity = "rare";
      else if (rand < 95) rarity = "epic";
      else rarity = "legendary";

      const pool = BOOTS.filter(b => b.rarity === rarity);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function generateTrack(count = 60) {
      track.innerHTML = '';
      const items = [];
      for (let i = 0; i < count; i++) {
        const boot = getRandomBoot();
        items.push(boot);
        track.appendChild(createBootCard(boot));
      }
      return items;
    }

    let currentItems = generateTrack();
    updateUI();

    // Открытие кейса
    openBtn.addEventListener('click', () => {
      if (balance < CASE_COST || isSpinning) return;

      balance -= CASE_COST;
      isSpinning = true;
      resultText.textContent = '';
      updateUI();

      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      currentItems = generateTrack(60);

      const targetIndex = 45;
      const winningBoot = currentItems[targetIndex];
      const cardWidth = 112;
      const viewportWidth = track.parentElement.clientWidth;
      
      const randomOffset = Math.floor(Math.random() * 60) - 30;
      const targetPos = (targetIndex * cardWidth) - (viewportWidth / 2) + (cardWidth / 2) + randomOffset;

      setTimeout(() => {
        track.style.transition = 'transform 5s cubic-bezier(0.08, 0.82, 0.17, 0.99)';
        track.style.transform = `translateX(-${targetPos}px)`;
      }, 50);

      setTimeout(() => {
        isSpinning = false;
        
        if (collection.includes(winningBoot.id)) {
          balance += winningBoot.price;
          resultText.style.color = '#ffcc00';
          resultText.textContent = `Повторка ${winningBoot.name}! +${winningBoot.price} ⭐`;
        } else {
          collection.push(winningBoot.id);
          if (!equippedBootId) equippedBootId = winningBoot.id;
          
          resultText.style.color = '#00ff66';
          resultText.textContent = `НОВАЯ БУТСА: ${winningBoot.brand} ${winningBoot.name}!`;
        }
        
        updateUI();
      }, 5100);
    });
  </script>
</body>
</html>
